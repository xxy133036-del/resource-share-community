spring:
  application:
    name: admin8012-test
  cloud:
    nacos:
      discovery:
        namespace: hc1job01
        server-addr: 127.0.0.1:8848,127.0.0.1:8849,127.0.0.1:8850
        username: nacos
        password: nacos
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8719
      eager: true
  cache:
    redis:
      time-to-live: 600000
  jackson:
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hc1db_admin?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: admin123
        reset-enable: false
      web-stat-filter:
        enabled: true
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*'
        url-pattern: /*
      aop-patterns: com.hc1.admin8012.*
      filters: stat,wall
      filter:
        stat:
          enabled: true
          slow-sql-millis: 1000
          log-slow-sql: true
        wall:
          enabled: true
          config:
            drop-table-allow: false

server:
  port: 8012
  servlet:
    context-path: /admin8012

management:
  endpoints:
    web:
      exposure:
        include: "*"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: "com.hc1.admin8012.bean"

feign:
  sentinel:
    enabled: true
  client:
    config:
      user8011:
        logger-level: full
        connect-timeout: 5000
        read-timeout: 5000
        request-interceptors:
          - com.hc1.admin8012.config.FeignRequestInterceptor

# ---------------- RS256 JWT 签发 / 校验 ----------------
jwt:
  private-key-file: ${JWT_PRIVATE_KEY_FILE:}
  public-key-file: ${JWT_PUBLIC_KEY_FILE:}
  issuer: 弘创小明
  expire-minutes: 60
