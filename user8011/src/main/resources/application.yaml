spring:
  application:
    name: user8011
  cloud:
    nacos:
      discovery:
        namespace: hc1job01
        server-addr: 127.0.0.1:8848,127.0.0.1:8849,127.0.0.1:8850
        username: nacos
        password: nacos
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8719 #客户端监控接口  如果冲突则自动+1 直到找到不冲突的
      eager: true
      datasource:
        # 流控规则数据源
        flow:
          nacos:
            server-addr: 127.0.0.1:8848
            username: nacos
            password: nacos
            data-id: ${spring.application.name}-flow-rules
            group-id: DEFAULT_GROUP
            namespace: hc1job01
            rule-type: flow
        # 降级规则数据源
        degrade:
          nacos:
            server-addr: 127.0.0.1:8848
            username: nacos
            password: nacos
            data-id: ${spring.application.name}-degrade-rules
            group-id: DEFAULT_GROUP
            namespace: hc1job01
            rule-type: degrade
  cache:
    redis:
      time-to-live: 600000
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB # 单个文件大小限制
      max-request-size: 100MB # 单次请求总大小限制
  messages:
    basename: hc1 # 国际化文件基础名称
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:  jdbc:mysql://localhost:3306/hc1db_user?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      stat-view-servlet: # 开启 Druid Web 监控页面
        enabled: true
        login-username: admin
        login-password: admin123
        reset-enable: false
      web-stat-filter: # Web 请求监控过滤
        enabled: true
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*'
        url-pattern: /*
      aop-patterns: com.hc1.user8011.* # Spring Bean 监控切点
      filters: stat,wall # 启用统计和防火墙插件
      filter:
        stat: # 慢 SQL 监控
          enabled: true
          slow-sql-millis: 1000 # 超过1秒记录为慢SQL
          log-slow-sql: true
        wall: # SQL 防火墙
          enabled: true
          config:
            drop-table-allow: false # 严禁应用执行 DROP TABLE 删表操作
server:
  port: 8011
  servlet:
    context-path: /user8011

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 控制台打印底层 SQL (开发环境推荐)
  type-aliases-package: "com.hc1.user8011.bean" # 实体类包别名扫描路径

ai-agent:
  url: http://localhost:8013