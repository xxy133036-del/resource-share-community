server {
    listen 80;
    server_name localhost;

    location /user8011/ {
        proxy_pass http://hc1user8011:8011/user8011/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin8012/ {
        proxy_pass http://hc1admin8012:8012/admin8012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 【安全】不暴露 /ai-agent/ 到公网。
    #
    # ai-agent 不经 Nginx 暴露；Java 通过容器网络直连，Python 业务接口还会校验 RSA 签名。
    # 容器间调用走 http://ai-agent:8013，无需经过 nginx。
    location /ai-agent/ {
        return 404;
    }

    location / {
        return 200 'Springbootjob gateway is running';
        add_header Content-Type text/plain;
    }
}
