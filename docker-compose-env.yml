# ============================================================
#  HCShare —— springbootjob 本地开发中间件编排
#  只负责：Nacos 三节点集群 + Redis + Sentinel 控制台
#  MySQL 不进容器，由你每次手动启动，本编排通过
#  host.docker.internal 连宿主机的 3306。
#
#  【启动前必须确认】
#    1) 宿主机 MySQL 已启动，且存在 nacos 库及建表脚本
#    2) 宿主机 6379 / 8848-8850 / 9848-9850 / 8080 端口空闲
#
#  【常用命令】（在项目根目录执行）
#    启动：  docker compose -f docker-compose-env.yml up -d
#    查看：  docker compose -f docker-compose-env.yml ps
#    日志：  docker compose -f docker-compose-env.yml logs -f nacos1
#    停止：  docker compose -f docker-compose-env.yml stop
# ============================================================
name: HCShare

# Nacos 三节点公共配置（YAML 锚点，避免重复）
x-nacos-common: &nacos-common
  image: nacos/nacos-server:v2.2.3
  restart: "no"
  environment:
    MODE: cluster
    NACOS_SERVERS: "nacos1:8848 nacos2:8848 nacos3:8848"
    PREFER_HOST_MODE: hostname
    SPRING_DATASOURCE_PLATFORM: mysql
    # 指向宿主机 MySQL（不是容器内的 mysql 服务）
    MYSQL_SERVICE_HOST: host.docker.internal
    MYSQL_SERVICE_PORT: "3306"
    MYSQL_SERVICE_DB_NAME: nacos
    MYSQL_SERVICE_USER: root
    MYSQL_SERVICE_PASSWORD: "123456"
    # allowPublicKeyRetrieval 兜底 MySQL8 认证插件差异；connectTimeout 调大避免启动瞬间连不上就放弃
    MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=3000&socketTimeout=5000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    JVM_XMS: 256m
    JVM_XMX: 512m
    # 镜像默认 Xmn=512m 会等于 Xmx，新生代吃满整个堆，这里显式调回 256m
    JVM_XMN: 256m
    TZ: Asia/Shanghai
  # Windows Docker Desktop 自带 host.docker.internal，这里显式声明做兼容兜底
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - hcshare

services:

  # ---------- Redis：缓存 + Pub/Sub 公告广播 ----------
  redis:
    image: redis:7.2-alpine
    container_name: HCShare-redis
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hcshare

  # ---------- Nacos 集群：8848 / 8849 / 8850 ----------
  nacos1:
    <<: *nacos-common
    container_name: HCShare-nacos1
    hostname: nacos1
    ports:
      - "8848:8848"
      - "9848:9848"

  nacos2:
    <<: *nacos-common
    container_name: HCShare-nacos2
    hostname: nacos2
    ports:
      - "8849:8848"
      - "9849:9848"

  nacos3:
    <<: *nacos-common
    container_name: HCShare-nacos3
    hostname: nacos3
    ports:
      - "8850:8848"
      - "9850:9848"

  # ---------- Sentinel 控制台 ----------
  # 注意：bladex/sentinel-dashboard 镜像内部监听的端口是 8858，不是 8080！
  # 所以这里必须写 "8080:8858"（宿主机 8080 → 容器 8858），
  # 写成 "8080:8080" 会导致宿主机 8080 映射到容器内没人监听的端口，控制台打不开。
  # 应用侧 application.yaml 仍配 localhost:8080，无需改动。
  sentinel:
    image: bladex/sentinel-dashboard:1.8.0
    container_name: HCShare-sentinel
    restart: "no"
    ports:
      - "8080:8858"
    environment:
      TZ: Asia/Shanghai
    networks:
      - hcshare

networks:
  hcshare:
    name: HCShare

volumes:
  redis_data:
    name: HCShare-redis-data
